name: Build WASM

# Builds the two vendored WebAssembly clients from pinned upstream sources + the patches in
# build/patches, runs the tests, and on a version tag (v*) publishes them as release assets.
# One job, no workflow artifacts (release assets don't count against the artifact storage quota).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used by the release step on tags
    steps:
      - uses: actions/checkout@v4

      # --- Tailscale client (tsconnect, Go -> WASM) ---
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: tailscale-${{ hashFiles('build/build-tailscale.sh', 'build/patches/tailscale/**') }}
          restore-keys: tailscale-
      - name: Build Tailscale client
        run: build/build-tailscale.sh

      # --- Tor client (webtor-rs, Rust -> WASM) ---
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/registry
            ~/.cargo/git
            .work/webtor-rs/target
          key: webtor-${{ hashFiles('build/build-webtor.sh', 'build/patches/webtor-rs/**') }}
          restore-keys: webtor-
      - name: Install wasm-bindgen-cli 0.2.106
        run: command -v wasm-bindgen >/dev/null && [ "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.106" ] || cargo install wasm-bindgen-cli --version 0.2.106 --locked
      - name: Build Tor client
        run: build/build-webtor.sh

      # --- Tests ---
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: for f in *.js vendor/*/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/

      # --- Release (tags only) ---
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -czf cors-rot-vendor.tar.gz vendor/webtor vendor/tailscale
          sha256sum cors-rot-vendor.tar.gz > cors-rot-vendor.tar.gz.sha256
          cat vendor/webtor/BUILD.txt vendor/tailscale/BUILD.txt > BUILD.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cors-rot-vendor.tar.gz cors-rot-vendor.tar.gz.sha256 BUILD.txt --repo "$GITHUB_REPOSITORY" --title "cors-rot $GITHUB_REF_NAME" --generate-notes
